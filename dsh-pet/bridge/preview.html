<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>桌宠放映室 · JONSBO</title>
  <link rel="stylesheet" href="/preview.css" />
  <main>
    <header>
      <div>
        <div class="eyebrow">PET TRIO / SCREEN ROOM</div>
        <h1>桌宠放映室</h1>
        <small>选好陪伴你的她，剩下的交给屏幕。</small>
      </div>
      <small id="build"></small><span id="badge" class="badge" role="status">检查连接中</span>
    </header>
    <div class="layout">
      <section class="panel preview" aria-label="投屏预览">
        <img id="frame" hidden alt="当前投屏的完整画面" />
        <div id="empty" class="empty">等待桌宠画面<br /><small>在 DSH 或 ChatGPT / Codex 中开启桌宠</small></div>
      </section>
      <div class="stack">
        <section class="panel">
          <h2>谁来上屏</h2>
          <div id="sources" class="sources" aria-label="在线桌宠实例"></div>
          <p class="notice" id="selection">先开启桌宠，再选择画面。</p>
          <div class="actions">
            <button id="connect" class="primary">连接屏幕</button><button id="disconnect">断开投屏</button>
          </div>
          <button id="takeover" class="takeover" hidden>接管屏幕 · 退出官方程序</button>
          <p class="notice" id="connection">正在检查乔思伯屏幕…</p>
        </section>
        <section class="panel">
          <details class="customize">
            <summary>屏幕背景与旋转</summary>
            <label for="rotation">顺时针旋转</label
            ><select id="rotation">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
            <h2>屏幕背景</h2>
            <div id="backgrounds" class="backgrounds" aria-label="选择屏幕背景"></div>
            <p class="muted" id="background-status"></p>
          </details>
        </section>
        <section class="panel">
          <h2>一起玩一会</h2>
          <select id="duet" aria-label="双人互动">
            <option value="auto">自动轮换 · 8 种互动</option>
            <option value="off">关闭互动 · 各自陪伴</option>
            <option value="boxing">拳击</option>
            <option value="volleyball">排球</option>
            <option value="running">赛跑</option>
            <option value="shopping">逛街</option>
            <option value="sunset">看日落</option>
            <option value="gardening">浇花</option>
            <option value="gaming">格斗游戏比赛</option>
            <option value="cafe">咖啡厅看书</option>
          </select>
          <p id="participants" class="muted"></p>
          <p id="duet-status" class="notice">检查双方连接中…</p>
        </section>
      </div>
    </div>
    <p id="result" role="status" aria-live="polite"></p>
    <details>
      <summary>连接详情与诊断</summary>
      <button id="copy-diagnostics">复制诊断</button>
      <pre id="status"></pre>
    </details>
    <footer>
      每只桌宠独立管理。点击角色卡切换；断开后其他已启用的桌宠可以接替。桌宠动作与显隐在各自右键菜单中管理。
    </footer>
  </main>
  <script type="module" src="/preview.js"></script>
</html>
